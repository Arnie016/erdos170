<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="Exact residue-chain coverage: spacing 3 requires 12 reflected right-tail marks while spacing 5 requires 10 for 30 long distances">
