<text x="60" y="620" fill="#F5E1A9" font-size="16" font-weight="550" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">THEOREM  •  r·a divides r·q, so a divides q. No 6-mark right tail can rescue a=4.</text>
