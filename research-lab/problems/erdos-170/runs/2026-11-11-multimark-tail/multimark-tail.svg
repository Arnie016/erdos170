<text x="82" y="427" fill="#F9B18A" font-size="13" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">IMPOSSIBLE AT EQUALITY</text>
<text x="60" y="455" fill="#F0F2EB" font-size="19" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">a = 4  •  q = 6  •  a does not divide q</text>
