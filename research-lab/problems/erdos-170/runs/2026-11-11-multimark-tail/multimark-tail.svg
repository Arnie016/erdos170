<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title description">
<title id="title">Tight three-mark sparse-ruler endpoint tiling</title><desc id="description">The feasible a=3 and q=6 profiles cover all eighteen long-distance offsets exactly once. An illustrative a=4 tail repeats four offsets and misses four. The general impossibility of a=4 follows from the proved divisibility obstruction.</desc>
<rect x="0" y="0" width="1080" height="680" rx="0" fill="#0D1824" stroke="none"/>
<rect x="30" y="28" width="1020" height="624" rx="22" fill="#142436" stroke="#375064"/>
<rect x="60" y="61" width="117" height="30" rx="15" fill="#284D4A" stroke="none"/>
<text x="119" y="82" fill="#9EE5D6" font-size="13" font-weight="700" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">ERDŐS 170</text>
<text x="60" y="132" fill="#F7F6EE" font-size="32" font-weight="750" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">When a sparse tail tiles perfectly</text>
<text x="60" y="164" fill="#BFCED4" font-size="17" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Longest distances become an exact sumset:  3 left marks × 6 right marks</text>
<line x1="60" y1="189" x2="1020" y2="189" stroke="#375064"/>
<rect x="60" y="213" width="12" height="12" rx="3" fill="#69DACB" stroke="none"/>
<text x="82" y="224" fill="#7AE5D2" font-size="13" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">FEASIBLE</text>
<text x="60" y="252" fill="#F0F2EB" font-size="19" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">a = 3  •  L = {0,3,6}  •  R = {0,1,2,9,10,11}</text>
<text x="60" y="278" fill="#AFC1CB" font-size="15" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Each cell denotes one of the 18 required long-distance offsets.</text>
