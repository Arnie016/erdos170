<svg xmlns="http://www.w3.org/2000/svg" width="990" height="550" viewBox="0 0 990 550" role="img" aria-labelledby="title desc"><title id="title">Endpoint tiling in sparse rulers</title><desc id="desc">For a tight 12-pair budget, offset a=3 gives complete long-distance coverage with a specially structured right tail. A sample a=4 profile misses the final two targets. The proof rules out all six-mark right tails for offset four.</desc><rect width="990" height="550" rx="20" fill="#141C27"/><text x="58" y="66" font-family="system-ui,sans-serif" font-size="33" font-weight="700" fill="#F0F5F5">When a pair count is not enough</text><text x="58" y="99" font-family="system-ui,sans-serif" font-size="16" fill="#B6C7D0">Restricted sparse rulers · the longest twelve distances</text><line x1="58" y1="120" x2="925" y2="120" stroke="#374955"/><text x="58" y="163" font-family="system-ui" font-size="18" font-weight="600" fill="#A5E4D8">VALID HIGH-DISTANCE TAIL · a = 3</text><text x="58" y="192" font-family="system-ui" font-size="16" fill="#D5E0E5">L={0,3} and R={0,1,2,6,7,8}: each deficit occurs exactly once.</text><rect x="58" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="85.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">0</text><rect x="126" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="153.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">1</text><rect x="194" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="221.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">2</text><rect x="262" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="289.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">3</text><rect x="330" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="357.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">4</text><rect x="398" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="425.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">5</text><rect x="466" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="493.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">6</text><rect x="534" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="561.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">7</text><rect x="602" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="629.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">8</text><rect x="670" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="697.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">9</text><rect x="738" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="765.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">10</text><rect x="806" y="215" width="55" height="48" rx="8" fill="#233E39" stroke="#60C7B6" stroke-width="1.5"/><text x="833.5" y="245" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#ECF7F5">11</text><text x="58" y="311" font-family="system-ui" font-size="18" font-weight="600" fill="#F0B3A3">FAILED EXAMPLE · a = 4</text><text x="58" y="339" font-family="system-ui" font-size="16" fill="#D5E0E5">