<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">Complementary three-bin smoothing kernels defeat the entire scalar family</title>
<desc id="desc">Exact bin proportions for kernels 3/20,7/10,3/20 and 17/60,13/30,17/60; all combined covering sums equal one. A squared-coefficient axis locates the exact mixed certificate ab approximately 0.91769 below the universal scalar lower bound 0.9608. Schematic proof summary, not new Sidon data.</desc>
<rect width="1120" height="520" fill="#F7F5F0"/><rect x="25" y="25" width="1070" height="470" rx="22" fill="white" stroke="#CADBD7"/>
<text x="67" y="67" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#176B64" letter-spacing="2">SIDON SETS  /  EXACT SMOOTHING</text>
<text x="67" y="108" font-family="Georgia,serif" font-size="31" font-weight="bold" fill="#172C33">When two imperfect kernels cooperate</text>
<text x="67" y="137" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#5F7478">Hou–Zhao m = 3, L = 1  ·  equal mixture</text>
<text x="67" y="192" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#18343A">p¹ = (3/20, 7/10, 3/20)</text>
<g transform="translate(410,159)"><rect width="90" height="49" fill="#88C3B9" rx="4"/><rect x="94" width="420" height="49" fill="#16776F" rx="4"/><rect x="518" width="90" height="49" fill="#88C3B9" rx="4"/><g font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle"><text x="45" y="32" fill="#194A46">.15</text><text x="304" y="32" fill="white">.70</text><text x="563" y="32" fill="#194A46">.15</text></g></g>
<text x="67" y="261" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#18343A">p² = (17/60, 13/30, 17/60)</text>
<g transform="translate(410,225)"><rect width="170" height="49" fill="#F0C4A3" rx="4"/><rect x="174" width="260" height="49" fill="#C77A43" rx="4"/><rect x="438" width="170" height="49" fill="#F0C4A3" rx="4"/><g font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle"><text x="85" y="32" fill="#5A331F">.2833…</text><text x="304" y="32" fill="white">.4333…</text><text x="523" y="32" fill="#5A331F">.2833…</text></g></g>
<rect x="67" y="302" width="945" height="46" rx="11" fill="#E8F5F2"/><text x="87" y="332" font-size="21" fill="#176B64" font-family="Georgia,serif">Combined coverage: C₀ = C₁ = C₂ = C₃ = 1</text>
<text x="67" y="389" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#18343A">SQUARED COEFFICIENT  ab</text>
<line x1="160" y1="435" x2="1005" y2="435" stroke="#90A5A4" stroke-width="3"/>
<g font-size="13" font-family="Helvetica,Arial,sans-serif" fill="#667E83" text-anchor="middle"><text x="160" y="456">0.90</text><text x="329" y="456">0.92</text><text x="498" y="456">0.94</text><text x="667" y="456">0.96</text><text x="836" y="456">0.98</text><text x="1005" y="456">1.00</text></g>
<line x1="309" y1="407" x2="309" y2="435" stroke="#16776F" stroke-width="3"/><circle cx="309" cy="435" r="7" fill="#16776F"/><text x="309" y="399" font-family="Helvetica,Arial,sans-serif" fill="#16776F" font-size="15" font-weight="bold" text-anchor="middle">MIX 0.91769…</text>
<line x1="674" y1="407" x2="674" y2="435" stroke="#C77A43" stroke-width="3"/><circle cx="674" cy="435" r="7" fill="#C77A43"/><text x="674" y="399" font-family="Helvetica,Arial,sans-serif" fill="#A65D30" font-size="15" font-weight="bold" text-anchor="middle">SCALAR &gt; 0.9608</text>
<text x="67" y="482" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#799196">Exact rational theorem. Not an improvement on the published upper bound.</text>
