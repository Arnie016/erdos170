<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">The finite-field obstruction for five missing residues</title><desc id="desc">In the prime field with 1129 elements, 45 has order 47 and P(45) is zero. Distinct subset sums require a nonzero missing-residue value, giving a contradiction for n equal to 9 modulo 23. The ordinary proof is linked in the README.</desc><rect x="0" y="0" width="1200" height="520" rx="20" fill="#F5F2E9" stroke="none"/><text x="42" y="52" font-family="Georgia, serif" font-size="34" font-weight="400" fill="#142D31" >Five holes. One impossible root.</text><text x="42" y="83" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#617478" >A visual reading of the existing finite-field certificate.</text><rect x="36" y="111" width="465" height="310" rx="16" fill="#142D31" stroke="none"/><text x="64" y="149" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9EE4C4" letter-spacing="1.2">THE ARITHMETIC WITNESS</text><text x="64" y="209" font-family="Georgia, serif" font-size="35" font-weight="400" fill="#F5F2E9" >p = 1129;  r = 45</text><text x="64" y="254" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#9EE4C4" >45⁴⁷ ≡ 1  (mod 1129)</text><text x="64" y="294" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#F5F2E9" >P(X) = X⁸ + X⁵ + X⁴ + X³ + 1</text><text x="64" y="339" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#EFA975" >P(45) ≡ 0  (mod 1129)</text><text x="64" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#BED3CE" >Exact order 47 · checked prime field</text><rect x="527" y="111" width="637" height="139" rx="16" fill="#E1EDE6" stroke="none"/><text x="553" y="146" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#287B70" >IF ALL SUBSET SUMS ARE DISTINCT</text><text x="553" y="185" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#142D31" >Each factor 1 + rᵃ is nonzero.</text><text x="553" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#617478" >Odd-order powers cannot equal −1.</text><rect x="527" y="272" width="637" height="149" rx="16" fill="#F3E7DB" stroke="none"/><text x="553" y="306" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#925B32" >BUT THIS FIVE-HOLE SHAPE FORCES</text><text x="553" y="346" font-family="Georgia, serif" font-size="27" font-weight="400" fill="#142D31" >H(r) = rᶜ⁻⁴ P(r) = 0.</text><text x="553" y="385" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#142D31" >Contradiction: product(1 + rᵃ) = −H(r).</text><text x="42" y="463" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142D31" >SCOPE  n = 9 + 23k, k ≥ 0; N = 2ⁿ + 5; holes {c, c ± 1, c ± 4}.</text><text x="42" y="492" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#617478" >The theorem is unchanged. This panel explains its compact certificate, not a new discovery.</text></svg>
