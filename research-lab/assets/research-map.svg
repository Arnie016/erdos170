<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="644" viewBox="0 0 1200 644" role="img" aria-labelledby="title desc"><title id="title">Four directions for mathematical exploration</title><desc id="desc">Combinatorics, sparse and dense structures, geometry and complex dynamics. Illustrations are schematic. The ruler shows marks 0, 1, 4, 6; the quadratic picture shows only familiar component outlines.</desc><rect x="0" y="0" width="1200" height="644" rx="20" fill="#F5F2E9" stroke="none"/><text x="42" y="51" font-family="Georgia, serif" font-size="34" font-weight="400" fill="#142D31" >A map of questions</text><text x="42" y="81" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#617478" >New terrain is a starting point, not a discovery claim.</text><rect x="36" y="112" width="546" height="236" rx="16" fill="#E5EEE7" stroke="none"/><text x="60" y="146" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#287B70" >01</text><text x="60" y="189" font-family="Georgia, serif" font-size="29" font-weight="400" fill="#142D31" >Combinatorics</text><text x="60" y="221" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#617478" >What patterns become unavoidable?</text><rect x="618" y="112" width="546" height="236" rx="16" fill="#F4E8D8" stroke="none"/><text x="642" y="146" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#287B70" >02</text><text x="642" y="189" font-family="Georgia, serif" font-size="29" font-weight="400" fill="#142D31" >Sparse / dense</text><text x="642" y="221" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#617478" >How much can a small set cover?</text><rect x="36" y="372" width="546" height="236" rx="16" fill="#EAE5F3" stroke="none"/><text x="60" y="406" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#287B70" >03</text><text x="60" y="449" font-family="Georgia, serif" font-size="29" font-weight="400" fill="#142D31" >Geometry</text><text x="60" y="481" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#617478" >Which configurations can exist?</text><rect x="618" y="372" width="546" height="236" rx="16" fill="#E1ECEC" stroke="none"/><text x="642" y="406" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#287B70" >04</text><text x="642" y="449" font-family="Georgia, serif" font-size="29" font-weight="400" fill="#142D31" >Complex dynamics</text><text x="642" y="481" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#617478" >Can a whole region be certified?</text><line x1="525.0" y1="205.0" x2="491.0" y2="263.89" stroke="#287B70" stroke-width="1.5" /><line x1="491.0" y1="263.89" x2="423.0" y2="263.89" stroke="#287B70" stroke-width="1.5" /><line x1="423.0" y1="263.89" x2="389.0" y2="205.0" stroke="#287B70" stroke-width="1.5" /><line x1="389.0" y1="205.0" x2="423.0" y2="146.11" stroke="#287B70" stroke-width="1.5" /><line x1="423.0" y1="146.11" x2="491.0" y2="146.11" stroke="#287B70" stroke-width="1.5" /><line x1="491.0" y1="146.11" x2="525.0" y2="205.0" stroke="#287B70" stroke-width="1.5" /><line x1="525.0" y1="205.0" x2="389.0" y2="205.0" stroke="#287B70" stroke-width="1.5" /><line x1="491.0" y1="263.89" x2="423.0" y2="146.11" stroke="#287B70" stroke-width="1.5" /><circle cx="525.0" cy="205.0" r="4" fill="#142D31" stroke="none" stroke-width="2"/><circle cx="491.0" cy="263.89" r="4" fill="#142D31" stroke="none" stroke-width="2"/><circle cx="423.0" cy="263.89" r="4" fill="#142D31" stroke="none" stroke-width="2"/><circle cx="389.0" cy="205.0" r="4" fill="#142D31" stroke="none" stroke-width="2"/><circle cx="423.0" cy="146.11" r="4" fill="#142D31" stroke="none" stroke-width="2"/><circle cx="491.0" cy="146.11" r="4" fill="#142D31" stroke="none" stroke-width="2"/><text x="60" y="319" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#287B70" >Extremal graphs · finite structures</text><line x1="671" y1="282" x