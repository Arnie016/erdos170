<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">From a question to checked evidence, with an explicit correction loop</title><desc id="desc">Ask, derive, challenge, release. A failed or incomplete check goes back to the question. It does not weaken the acceptance test. Different proof statuses remain separate.</desc><rect x="0" y="0" width="1200" height="440" rx="20" fill="#F5F2E9" stroke="none"/><text x="42" y="53" font-family="Georgia, serif" font-size="31" font-weight="400" fill="#142D31" >A beautiful idea still has to survive a check.</text><text x="42" y="86" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#617478" >The workflow preserves failure instead of editing it away.</text><rect x="40" y="126" width="238" height="136" rx="12" fill="#FFFFFF" stroke="#D7DEDA"/><text x="60" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#287B70" >01  ASK</text><text x="60" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#142D31" >One precise question.</text><text x="60" y="222" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#617478" >State the falsifier.</text><line x1="287" y1="193" x2="322" y2="193" stroke="#287B70" stroke-width="2" /><path d="M 316 187 L 322 193 L 316 199" fill="none" stroke="#287B70" stroke-width="2"/><rect x="334" y="126" width="238" height="136" rx="12" fill="#FFFFFF" stroke="#D7DEDA"/><text x="354" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#287B70" >02  DERIVE</text><text x="354" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#142D31" >A proof or construction.</text><text x="354" y="222" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#617478" >Make assumptions visible.</text><line x1="581" y1="193" x2="616" y2="193" stroke="#287B70" stroke-width="2" /><path d="M 610 187 L 616 193 L 610 199" fill="none" stroke="#287B70" stroke-width="2"/><rect x="628" y="126" width="238" height="136" rx="12" fill="#FFFFFF" stroke="#D7DEDA"/><text x="648" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#287B70" >03  CHALLENGE</text><text x="648" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#142D31" >Check the weakest step.</text><text x="648" y="222" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#617478" >Keep the evaluator fixed.</text><line x1="875" y1="193" x2="910" y2="193" stroke="#287B70" stroke-width="2" /><path d="M 904 187 L 910 193 L 904 199" fill="none" stroke="#287B70" stroke-width="2"/><rect x="922" y="126" width="238" height="136" rx="12" fill="#FFFFFF" stroke="#D7DEDA"/><text x="942" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#287B70" >04  RELEASE</text><text x="942" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#142D31" >Publish the scoped claim.</text><text x="942" y="222" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#617478" >Link the actual evidence.</text><path d="M 747 266 V 310 H 160 V 273" fill="none" stroke="#8E83C7" stroke-width="2"/><path d="M 154 280 L 160 273 L 166 280" fill="none" stroke="#8E83C7" stroke-width="2"/><rect x="302" y="292" width="310" height="35" rx="2" fill="#F5F2E9" stroke="none"/><text x="457" y="315" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#8E83C7" text-anchor="middle">COUNTEREXAMPLE OR INCOMPLETE</text><text x="42" y="380" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#142D31" >Proof ≠ finite certificate ≠ formal verification.</text><text x="42" y="410" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#617478" >No claim is promoted just because an unrelated CI job is green.</text></svg>
