name: Math Research Verification
on:
  push:
    paths:
      - 'README.md'
      - 'research-lab/**'
      - '.github/workflows/math-research-ci.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'research-lab/**'
      - '.github/workflows/math-research-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate catalog and local navigation
        run: timeout 20s python3 research-lab/tools/catalog.py --check
      - name: Reject invalid metadata and false verification labels
        run: timeout 20s python3 -m unittest discover -s research-lab/tools -p test_catalog.py -v
  lean-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research-lab/lean
          auto-config: false
          build: true
          build-args: '--wfail'
          test: false
          use-mathlib-cache: false
      - name: Inspect theorem dependencies
        working-directory: research-lab/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean OpenMath/Certificates.lean | tee axioms.log
          if grep -E 'sorryAx|Lean\.ofReduceBool|Lean\.trustCompiler' axioms.log; then
            echo 'Unapproved theorem dependency detected'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-witness-axioms
          path: research-lab/lean/axioms.log
          if-no-files-found: warn
  computational-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce all eight studies with exact acceptance checks
        run: python3 research-lab/tools/verify_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathematical-certificates-and-receipts
          path: research-lab/_generated/**
          include-hidden-files: true
          if-no-files-found: error
  focused-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify registered field certificate and write exact receipt
        run: timeout --signal=KILL 35s python3 research-lab/harness/verify.py --only mod5-field47
      - name: Reject corrupted certificates and unsafe registry entries
        run: timeout --signal=KILL 35s python3 -m unittest discover -s research-lab/harness -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-certificate-receipts
          path: research-lab/_generated/focused/SUMMARY.json
          if-no-files-found: error
