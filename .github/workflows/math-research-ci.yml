name: Math Research Verification
on:
  push:
    paths:
      - 'README.md'
      - 'research-lab/**'
      - '.github/workflows/math-research-ci.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'research-lab/**'
      - '.github/workflows/math-research-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate catalog and local navigation
        run: timeout 20s python3 research-lab/tools/catalog.py --check
      - name: Reject invalid metadata and false verification labels
        run: timeout 20s python3 -m unittest discover -s research-lab/tools -p test_catalog.py -v
  lean-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research-lab/lean
          auto-config: false
          build: true
          build-args: '--wfail'
          test: false
          use-mathlib-cache: false
      - name: Inspect theorem dependencies
        working-directory: research-lab/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean OpenMath/Certificates.lean | tee axioms.log
          if grep -E 'sorryAx|Lean\.ofReduceBool|Lean\.trustCompiler' axioms.log; then
            echo 'Unapproved theorem dependency detected'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-witness-axioms
          path: research-lab/lean/axioms.log
          if-no-files-found: warn
  computational-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce all eight studies with exact acceptance checks
        run: python3 research-lab/tools/verify_all.py
      - name: Independently check #170 two-mark local exclusion
        shell: bash
        run: |
          set -euo pipefail
          d=research-lab/problems/erdos-170/runs/2026-10-18-two-mark-exclusion
          timeout -k 2s 32s python3 "$d/src/independent_exhaustive.py" "$d/raw/candidate.json" "$RUNNER_TEMP/two-mark-check.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["total_exactly_tested"] == 2437560 and r["complete_replacements"] == [] and r["baseline_missing"] == [493]' "$RUNNER_TEMP/two-mark-check.json"
      - name: Check #170 39-mark length-500 complete ruler
        shell: bash
        run: |
          set -euo pipefail
          d=research-lab/problems/erdos-170/runs/2026-10-20-39-mark-ruler
          timeout -k 1s 33s python3 "$d/independent_verify.py"
          python3 -c 'import csv,sys; r=list(csv.DictReader(open(sys.argv[1]))); assert len(r)==500 and [int(v["distance"]) for v in r]==list(range(1,501))' "$d/witnesses.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathematical-certificates-and-receipts
          path: research-lab/_generated/**
          include-hidden-files: true
          if-no-files-found: error

