name: Math Research Verification
on:
  push:
    paths:
      - 'README.md'
      - 'research-lab/**'
      - '.github/workflows/math-research-ci.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'research-lab/**'
      - '.github/workflows/math-research-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate catalog and local navigation
        run: timeout 20s python3 research-lab/tools/catalog.py --check
      - name: Reject invalid metadata and false verification labels
        run: timeout 20s python3 -m unittest discover -s research-lab/tools -p test_catalog.py -v
  lean-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research-lab/lean
          auto-config: false
          build: true
          build-args: '--wfail'
          test: false
          use-mathlib-cache: false
      - name: Inspect theorem dependencies
        working-directory: research-lab/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean OpenMath/Certificates.lean | tee axioms.log
          if grep -E 'sorryAx|Lean\.ofReduceBool|Lean\.trustCompiler' axioms.log; then
            echo 'Unapproved theorem dependency detected'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-witness-axioms
          path: research-lab/lean/axioms.log
          if-no-files-found: warn
  computational-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce all eight studies with exact acceptance checks
        run: python3 research-lab/tools/verify_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathematical-certificates-and-receipts
          path: research-lab/_generated/**
          include-hidden-files: true
          if-no-files-found: error

  endpoint-tiling-q6:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce exact two-tail q6 certificate
        run: |
          cd research-lab/problems/erdos-170/runs/2026-11-10-endpoint-tiling
          python3 run_workers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos170-endpoint-tiling-q6
          path: |
            research-lab/problems/erdos-170/runs/2026-11-10-endpoint-tiling/RUN_RECEIPTS.json
            research-lab/problems/erdos-170/runs/2026-11-10-endpoint-tiling/worker_*.json
            research-lab/problems/erdos-170/runs/2026-11-10-endpoint-tiling/worker_*.stdout
            research-lab/problems/erdos-170/runs/2026-11-10-endpoint-tiling/worker_*.stderr
          if-no-files-found: error


  endpoint-multimark-r3q6:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify all 49504 tight three-mark endpoint profiles with two exact methods
        shell: bash
        run: |
          set -euo pipefail
          cd research-lab/problems/erdos-170/runs/2026-11-11-multimark-tail
          timeout -s KILL 35s python3 worker_bits.py | tee worker_bits.reproduced.json
          timeout -s KILL 35s python3 worker_differences.py | tee worker_differences.reproduced.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos170-multimark-r3q6
          path: research-lab/problems/erdos-170/runs/2026-11-11-multimark-tail/*.reproduced.json
          if-no-files-found: warn
