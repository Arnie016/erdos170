name: Math Research Verification
on:
  push:
    paths:
      - 'README.md'
      - 'research-lab/**'
      - '.github/workflows/math-research-ci.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'research-lab/**'
      - '.github/workflows/math-research-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate catalog and local navigation
        run: timeout 20s python3 research-lab/tools/catalog.py --check
      - name: Reject invalid metadata and false verification labels
        run: timeout 20s python3 -m unittest discover -s research-lab/tools -p test_catalog.py -v
  lean-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research-lab/lean
          auto-config: false
          build: true
          build-args: '--wfail'
          test: false
          use-mathlib-cache: false
      - name: Inspect theorem dependencies
        working-directory: research-lab/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean OpenMath/Certificates.lean | tee axioms.log
          if grep -E 'sorryAx|Lean\.ofReduceBool|Lean\.trustCompiler' axioms.log; then
            echo 'Unapproved theorem dependency detected'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-witness-axioms
          path: research-lab/lean/axioms.log
          if-no-files-found: warn
  computational-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce all eight studies with exact acceptance checks
        run: python3 research-lab/tools/verify_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathematical-certificates-and-receipts
          path: research-lab/_generated/**
          include-hidden-files: true
          if-no-files-found: error

  modular133-finite:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compute exact subset-sum canonical census
        run: |
          mkdir -p research-lab/_generated/modular133
          timeout --signal=TERM --kill-after=2s 35s python3 research-lab/problems/modular-subset-sums/runs/2026-10-17-mod133-exact/search_mod133.py research-lab/_generated/modular133/search.json
      - name: Independently reproduce signed-difference census
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra research-lab/problems/modular-subset-sums/runs/2026-10-17-mod133-exact/check_mod133.cpp -o /tmp/check_mod133
          timeout --signal=TERM --kill-after=2s 35s /tmp/check_mod133 research-lab/_generated/modular133/independent.json
      - name: Cross-check outputs and negative control
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('research-lab/_generated/modular133/search.json').read_text())
          b=json.loads(Path('research-lab/_generated/modular133/independent.json').read_text())
          assert a['all_completed'] and b['completed']
          assert a['N']==b['N']==133 and a['n']==b['n']==7
          assert a['nodes_by_depth']==b['nodes']==[1,60,1830,36656,490780,3322318,2942381,162]
          assert a['first_bad'] is None
          assert len(b['accepted'])==162 and len(set(tuple(row) for row in b['accepted']))==162
          assert b['overlap_hist']=={'6':108,'7':54}
          assert [x['count'] for x in b['orbit_classes']]==[54,54,54]
          assert b['negative_control_distinct_subset_sums']==29
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular133-exact-witnesses
          path: research-lab/_generated/modular133/*.json
          if-no-files-found: warn

  modular261-finite:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Full unit-normalized subset-sum census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-lab/_generated/modular261
          timeout --signal=KILL 35s bash -c 'g++ -std=c++20 -O3 -Wall -Wextra research-lab/problems/modular-subset-sums/runs/2026-10-23-mod261-exact/src/search_a.cpp -o /tmp/mod261-a && exec /tmp/mod261-a research-lab/_generated/modular261'
      - name: Independent signed-difference census and direct witnesses
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 35s bash -c 'g++ -std=c++20 -O3 -Wall -Wextra research-lab/problems/modular-subset-sums/runs/2026-10-23-mod261-exact/src/check_b.cpp -o /tmp/mod261-b && exec /tmp/mod261-b research-lab/_generated/modular261'
      - name: Check exact domain, orbits, overlaps and controls
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('research-lab/_generated/modular261')
          a=json.loads((root/'worker_a.json').read_text())
          b=json.loads((root/'worker_b.json').read_text())
          assert a['completed'] and b['completed'] and b['full_lists_agree']
          assert a['N']==b['N']==261 and a['n']==b['n']==8
          assert a['nodes']==b['nodes']==[0,1,106,5230,151955,2675386,17477423,5418406,22]
          assert a['contains_one_count']==b['contains_one_count']==22
          assert b['canonical_count']==252 and b['signed_set_count']==64512
          assert [x['canonical_size'] for x in b['orbit_classes']]==[84,84,84]
          assert b['overlap_histogram']=={'7':168,'8':84}
          assert b['nonunit_count_histogram']=={'0':84,'1':168}
          assert b['outside_published_templates']==[]
          assert b['negative_control_subset_sums']==37 and b['removed_leaf_rejected']
          actual=(root/'worker_a_sets.txt').read_text()
          expected=Path('research-lab/problems/modular-subset-sums/runs/2026-10-23-mod261-exact/results/worker_a_sets.txt').read_text()
          assert actual==expected
          full=[tuple(map(int,s.split())) for s in (root/'full_sign_normalized_sets.txt').read_text().splitlines()]
          assert len(full)==len(set(full))==252
          print('PASS: complete n=8, N=261 classification, exact witnesses and controls')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular261-exact-witnesses
          path: research-lab/_generated/modular261/*
          if-no-files-found: warn
